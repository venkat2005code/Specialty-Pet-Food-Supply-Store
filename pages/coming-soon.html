<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon - PetStore</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class', theme: { extend: { colors: { primary: '#8b5cf6' } } } }</script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,
<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'>
<text y='50' font-size='50'>🐾</text>
</svg>">
</head>
<body class="bg-gradient-to-br from-purple-600 via-pink-600 to-orange-500 min-h-screen flex items-center justify-center p-4">
    <div class="text-center text-white max-w-3xl">
        <div class="text-8xl mb-8 animate-pulse">🐾</div>
        <h1 class="text-5xl md:text-7xl font-bold mb-6">Coming Soon</h1>
        <p class="text-2xl opacity-90 mb-12">Something paw-some is in the works! Stay tuned for our exciting launch.</p>
        
        <!-- Countdown Timer -->
        <div id="countdownTimer" class="flex flex-wrap justify-center gap-4 mb-12">
            <div class="countdown-item bg-white/20 backdrop-blur-md"><span class="countdown-number text-white" id="days">00</span><span class="countdown-label text-white/80">Days</span></div>
            <div class="countdown-item bg-white/20 backdrop-blur-md"><span class="countdown-number text-white" id="hours">00</span><span class="countdown-label text-white/80">Hours</span></div>
            <div class="countdown-item bg-white/20 backdrop-blur-md"><span class="countdown-number text-white" id="minutes">00</span><span class="countdown-label text-white/80">Minutes</span></div>
            <div class="countdown-item bg-white/20 backdrop-blur-md"><span class="countdown-number text-white" id="seconds">00</span><span class="countdown-label text-white/80">Seconds</span></div>
        </div>

        <!-- Email Subscription -->
        <div class="max-w-xl mx-auto mb-12">
            <p class="text-lg mb-6 opacity-90">Be the first to know when we launch! Subscribe for exclusive early access.</p>
            <form id="newsletterForm" class="flex flex-col sm:flex-row gap-4">
                <input type="email" placeholder="Enter your email" required class="flex-1 px-6 py-4 rounded-full text-gray-900 focus:outline-none focus:ring-4 focus:ring-white/50">
                <button type="submit" class="btn-glow px-8 py-4 bg-white text-purple-600 rounded-full font-bold hover:shadow-2xl transform hover:-translate-y-1 transition-all">
                    Notify Me <i class="fas fa-bell ml-2"></i>
                </button>
            </form>
        </div>

        <!-- Social Links -->
        <div class="flex justify-center space-x-6 mb-12">
            <a href="#" class="w-12 h-12 rounded-full bg-white/20 backdrop-blur-md flex items-center justify-center hover:bg-white hover:text-purple-600 transition-all"><i class="fab fa-facebook-f text-xl"></i></a>
            <a href="#" class="w-12 h-12 rounded-full bg-white/20 backdrop-blur-md flex items-center justify-center hover:bg-white hover:text-purple-600 transition-all"><i class="fab fa-twitter text-xl"></i></a>
            <a href="#" class="w-12 h-12 rounded-full bg-white/20 backdrop-blur-md flex items-center justify-center hover:bg-white hover:text-purple-600 transition-all"><i class="fab fa-instagram text-xl"></i></a>
            <a href="#" class="w-12 h-12 rounded-full bg-white/20 backdrop-blur-md flex items-center justify-center hover:bg-white hover:text-purple-600 transition-all"><i class="fab fa-linkedin-in text-xl"></i></a>
        </div>

        <a href="../index.html" class="inline-flex items-center text-white/80 hover:text-white transition-colors">
            <i class="fas fa-arrow-left mr-2"></i>Back to Home
        </a>
    </div>

    <script src="../assets/js/main.js"></script>
    <script>
        // Countdown Timer - Set launch date to 30 days from now
        const launchDate = new Date();
        launchDate.setDate(launchDate.getDate() + 30);
        
        function updateCountdown() {
            const now = new Date().getTime();
            const distance = launchDate.getTime() - now;
            
            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);
            
            document.getElementById('days').textContent = String(days).padStart(2, '0');
            document.getElementById('hours').textContent = String(hours).padStart(2, '0');
            document.getElementById('minutes').textContent = String(minutes).padStart(2, '0');
            document.getElementById('seconds').textContent = String(seconds).padStart(2, '0');
        }
        
        setInterval(updateCountdown, 1000);
        updateCountdown();
    </script>
</body>
</html>
