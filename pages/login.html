<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - PetStore</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class', theme: { extend: { colors: { primary: '#8b5cf6' } } } }</script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,
<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'>
<text y='50' font-size='50'>🐾</text>
</svg>">
</head>
<body class="bg-gradient-to-br from-purple-600 to-pink-600 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white dark:bg-gray-900 rounded-3xl shadow-2xl w-full max-w-md p-8 md:p-12">
        <div class="text-center mb-8">
            <a href="index.html" class="inline-flex items-center space-x-2 mb-6">
                <span class="text-5xl">🐾</span>
                <span class="text-3xl font-bold bg-gradient-to-r from-purple-600 to-pink-600 bg-clip-text text-transparent">PetStore</span>
            </a>
            <h1 class="text-3xl font-bold mb-2">Welcome Back!</h1>
            <p class="text-gray-600 dark:text-gray-400">Sign in to your account</p>
        </div>

        <form data-validate class="space-y-6">
            <div>
                <label class="block text-sm font-semibold mb-2">Email Address</label>
                <input type="email" required class="w-full px-4 py-3 rounded-lg border dark:border-gray-700 bg-white dark:bg-gray-800 focus:outline-none focus:ring-2 focus:ring-purple-600">
            </div>
            <div>
                <label class="block text-sm font-semibold mb-2">Password</label>
                <input type="password" required class="w-full px-4 py-3 rounded-lg border dark:border-gray-700 bg-white dark:bg-gray-800 focus:outline-none focus:ring-2 focus:ring-purple-600">
            </div>
            <div class="flex items-center justify-between">
                <label class="flex items-center"><input type="checkbox" class="mr-2"><span class="text-sm">Remember me</span></label>
                <a href="#" class="text-sm text-purple-600 hover:underline">Forgot password?</a>
            </div>
            <button type="submit" class="w-full py-4 bg-gradient-to-r from-purple-600 to-pink-600 text-white rounded-lg font-bold text-lg hover:shadow-lg transition-all">Sign In</button>
        </form>

        <div class="mt-8">
            <div class="relative my-6">
                <div class="absolute inset-0 flex items-center"><div class="w-full border-t dark:border-gray-700"></div></div>
                <div class="relative flex justify-center text-sm"><span class="px-4 bg-white dark:bg-gray-900 text-gray-500">Or continue with</span></div>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <button class="flex items-center justify-center px-4 py-3 border dark:border-gray-700 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-800 transition-colors">
                    <i class="fab fa-google text-red-500 mr-2"></i>Google
                </button>
                <button class="flex items-center justify-center px-4 py-3 border dark:border-gray-700 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-800 transition-colors">
                    <i class="fab fa-facebook-f text-blue-600 mr-2"></i>Facebook
                </button>
            </div>
        </div>

        <p class="text-center mt-8 text-gray-600 dark:text-gray-400">Don't have an account? <a href="register.html" class="text-purple-600 font-semibold hover:underline">Sign up</a></p>
    </div>
    <script src="../assets/js/main.js"></script>
</body>
</html>
